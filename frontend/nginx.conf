upstream backend {
    zone backend 64k;
    resolver 127.0.0.11 valid=5s;
    server backend:8000 resolve;
}

server {
    listen 80;
    absolute_redirect off;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend/;
        client_max_body_size 0;
    }

    location / {
        try_files $uri /index.html;
    }
}
